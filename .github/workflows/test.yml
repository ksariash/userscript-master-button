name: Userscript regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python build.py && node --check dist/master-button.user.js && npm test
      - run: git diff --exit-code -- dist/master-button.user.js dist/master-button.meta.js
      - run: pip install playwright==1.58.0 && python -m playwright install --with-deps chromium
      - run: |
          failed=0
          for test in browser reddit_delayed experience ux_revision page_review; do
            python "tests/$test.py" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: dist/*.png
