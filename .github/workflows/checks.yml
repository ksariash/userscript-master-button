name: Source and build checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist/master-button.user.js dist/master-button.meta.js dist/build.json
# This workflow checks policy/mock integration and the generated bundle. It does
# not download/evaluate a model, contact Azure, or perform physical iPhone checks.
